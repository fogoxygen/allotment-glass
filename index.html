<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Earn &amp; Save">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Earn &amp; Save</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:none}
#stage{position:fixed;inset:0;display:flex}
.eye{position:relative;flex:1;overflow:hidden;background:#000}
.eye video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.eye canvas{position:absolute;inset:0;width:100%;height:100%}
.eye+.eye{border-left:2px solid #000}
</style>
</head>
<body>
<div id="stage"></div>
<script type="module">
import { FilesetResolver, ObjectDetector } from './vendor/vision_bundle.mjs';

// ---- settings: none on screen. Change them in the address only -------------------------
const Q = new URLSearchParams(location.search);
const CFG = {
  eyes: Q.get('eyes') === '2' ? 2 : 1,          // 2 = side by side, for a viewer with lenses
  debug: Q.has('debug'),
  score: +(Q.get('score') || .2),               // detector confidence floor
  near: +(Q.get('near') || .1),                 // a cup must fill this share of the frame width (about 60 cm away) before anything is judged
  hold: +(Q.get('hold') || 1.2),                // seconds the finished stack must stay still
  delegate: Q.get('cpu') === '1' ? 'CPU' : 'GPU'
};
const TOKENS_PER_S = 833, CENTS_PER_S = .17, RESET_S = 1800;   // canon rates
// big things are never cups. Labels are not trusted otherwise: the detector often names a cup a kite or a phone
const EXCLUDE = new Set(['person', 'dining table', 'chair', 'couch', 'bed', 'laptop', 'tv', 'keyboard', 'refrigerator', 'oven', 'sink', 'toilet', 'bench', 'car', 'bus', 'truck', 'train', 'airplane', 'boat']);
const FONT = '-apple-system,"SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif';

// ---- stage -----------------------------------------------------------------------------
const stage = document.getElementById('stage');
const eyes = Array.from({ length: CFG.eyes }, () => {
  const d = document.createElement('div'), v = document.createElement('video'), c = document.createElement('canvas');
  d.className = 'eye'; v.muted = true; v.autoplay = true; v.playsInline = true; v.setAttribute('playsinline', '');
  d.append(v, c); stage.append(d); return { v, c };
});
const video = eyes[0].v;

// ---- state -----------------------------------------------------------------------------
const S = { phase: 'boot', msg: '', nStart: 0, progress: 0, filmed: 0, hold: 0, started: 0, lastProgress: 0, lastNear: 0, doneAt: 0, credit: null, A: null, At: 0, ms: 0 };
let detector = null, tracks = [], nextId = 1;
const obs = [];

const overlapMin = (a, b) => {
  const ix = Math.max(0, Math.min(a.x + a.w, b.x + b.w) - Math.max(a.x, b.x)), iy = Math.max(0, Math.min(a.y + a.h, b.y + b.h) - Math.max(a.y, b.y));
  return ix * iy / Math.max(1, Math.min(a.w * a.h, b.w * b.h));
};

// what is on the bench: cup-sized objects, merged when two labels land on one thing
function analyse(dets, vw, vh, now) {
  const items = [], hands = [];
  for (const d of dets.slice().sort((a, b) => b.categories[0].score - a.categories[0].score)) {
    const n = d.categories[0].categoryName, b = d.boundingBox, box = { x: b.originX, y: b.originY, w: b.width, h: b.height };
    if (n === 'person') { hands.push(box); continue; }
    if (EXCLUDE.has(n)) continue;
    if (box.w / vw < .025 || box.w / vw > .35 || box.h / vh > .6) continue;
    if (items.some(k => overlapMin(k, box) > .5)) continue;
    items.push(box);
  }
  const ws = items.map(i => i.w / vw).sort((a, b) => a - b);
  const near = items.length > 0 && ws[ws.length >> 1] >= CFG.near;
  const handsOver = hands.some(h => items.some(i => overlapMin(i, h) > .15));
  obs.push({ t: now, n: items.length, near, hands: handsOver });
  while (obs.length && now - obs[0].t > 3000) obs.shift();
  return { items, near, handsOver };
}
// the count that has held for the last 1.5 s, close up. null while it is still changing
function steadyCount(now) {
  const r = obs.filter(o => now - o.t < 1500 && o.near);
  if (r.length < 3) return null;
  const f = {};
  for (const o of r) f[o.n] = (f[o.n] || 0) + 1;
  const [n, c] = Object.entries(f).sort((a, b) => b[1] - a[1])[0];
  return c / r.length >= .7 ? +n : null;
}
function updateTracks(items, now) {
  for (const t of tracks) t.hit = false;
  for (const it of items) {
    let best = null, bd = Infinity;
    for (const t of tracks) {
      if (t.hit) continue;
      const d = Math.hypot(t.tgt.x + t.tgt.w / 2 - it.x - it.w / 2, t.tgt.y + t.tgt.h / 2 - it.y - it.h / 2);
      if (d < bd) { bd = d; best = t; }
    }
    if (best && bd < Math.max(it.w, it.h) * .9) { best.tgt = it; best.seen = now; best.hit = true; }
    else tracks.push({ id: nextId++, tgt: it, box: { ...it }, seen: now, hit: true });
  }
  tracks = tracks.filter(t => now - t.seen < 700);
}

// ---- the task: arms itself, pays only once the stack is verified ---------------------------
function step(now, dt) {
  const A = now - S.At < 900 ? S.A : null, sc = steadyCount(now);   // slow phones detect only a few times a second
  if (A && A.near) S.lastNear = now;
  if (S.phase === 'scan') {
    if (sc != null && sc >= 2) Object.assign(S, { phase: 'task', nStart: sc, progress: 0, filmed: 0, hold: 0, started: now, lastProgress: now });
  } else if (S.phase === 'task') {
    const onTask = now - S.lastNear < 1200;
    if (onTask) S.filmed += dt;                          // footage counts only while the cups are in view, close up
    if (sc != null) {
      if (sc > S.nStart) S.nStart = sc;
      const p = Math.max(0, Math.min(S.nStart - 1, S.nStart - sc));
      if (p !== S.progress) { S.progress = p; S.lastProgress = now; }
    }
    const one = A && A.items.length === 1 ? A.items[0] : null;
    const verifying = sc === 1 && one && one.h / one.w >= .95 && !A.handsOver && onTask;
    S.hold = verifying ? S.hold + dt : Math.max(0, S.hold - dt * 2);
    if (S.hold >= CFG.hold) {
      S.phase = 'done'; S.doneAt = now;
      S.credit = { secs: S.filmed, mtok: S.filmed * TOKENS_PER_S / 1e6, dollars: S.filmed * CENTS_PER_S / 100, cups: S.nStart };
    } else if (now - S.lastProgress > 45000 || now - S.started > 120000) { S.phase = 'fail'; S.doneAt = now; }
  } else if (S.phase === 'done' || S.phase === 'fail') {
    if (now - S.doneAt > (S.phase === 'done' ? 9000 : 5000)) { S.phase = 'scan'; tracks = []; nextId = 1; }
  }
  // one line of guidance, always the most useful one
  const items = A ? A.items.length : 0;
  if (S.phase === 'scan') S.msg = !items ? 'Look at the cups' : !A.near ? 'Move closer' : sc === 1 ? 'Waiting for the next task' : 'Scanning';
  else if (S.phase === 'task') S.msg = now - S.lastNear > 1200 ? (items ? 'Move closer' : 'Look at the cups') : S.hold > 0 ? 'Hold still' : 'Stack the cups into one';
}

// ---- drawing: white only ----------------------------------------------------------------
function spaced(c, text, x, y, size, weight, track, align, alpha) {
  c.font = `${weight} ${size}px ${FONT}`; c.textBaseline = 'middle'; c.textAlign = 'left'; c.globalAlpha = alpha ?? 1;
  const ch = [...text], w = ch.map(k => c.measureText(k).width), total = w.reduce((a, b) => a + b, 0) + track * (ch.length - 1);
  let cx = align === 'center' ? x - total / 2 : align === 'right' ? x - total : x;
  ch.forEach((k, i) => { c.fillText(k, cx, y); cx += w[i] + track; });
  c.globalAlpha = 1;
  return total;
}
function shade(c, W, H, u) {
  let g = c.createLinearGradient(0, 0, 0, 16 * u); g.addColorStop(0, 'rgba(0,0,0,.42)'); g.addColorStop(1, 'rgba(0,0,0,0)'); c.fillStyle = g; c.fillRect(0, 0, W, 16 * u);
  g = c.createLinearGradient(0, H - 30 * u, 0, H); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.4)'); c.fillStyle = g; c.fillRect(0, H - 30 * u, W, 30 * u);
  c.fillStyle = '#fff';
}
function brackets(c, x, y, w, h, u, alpha) {
  const L = Math.max(1.6 * u, Math.min(w, h) * .2);
  c.globalAlpha = alpha; c.strokeStyle = '#fff'; c.lineWidth = Math.max(1.2, .3 * u); c.lineCap = 'square'; c.beginPath();
  c.moveTo(x, y + L); c.lineTo(x, y); c.lineTo(x + L, y);
  c.moveTo(x + w - L, y); c.lineTo(x + w, y); c.lineTo(x + w, y + L);
  c.moveTo(x + w, y + h - L); c.lineTo(x + w, y + h); c.lineTo(x + w - L, y + h);
  c.moveTo(x + L, y + h); c.lineTo(x, y + h); c.lineTo(x, y + h - L);
  c.stroke(); c.globalAlpha = 1;
}
const clock = s => `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(Math.floor(s % 60)).padStart(2, '0')}`;

function draw(c, W, H, now) {
  c.clearRect(0, 0, W, H);
  const u = Math.min(W, H) / 100, vw = video.videoWidth || 16, vh = video.videoHeight || 9;
  const s = Math.max(W / vw, H / vh), ox = (W - vw * s) / 2, oy = (H - vh * s) / 2;
  c.shadowColor = 'rgba(0,0,0,.45)'; c.shadowBlur = 6;
  shade(c, W, H, u);

  if (S.phase === 'boot' || S.phase === 'nocam') {
    spaced(c, S.phase === 'nocam' ? 'CAMERA NEEDED' : 'EARN & SAVE', W / 2, H / 2 - 3 * u, 1.9 * u, 600, .5 * u, 'center', .7);
    spaced(c, S.msg, W / 2, H / 2 + 2 * u, 3.4 * u, 500, .05 * u, 'center');
    if (S.phase === 'boot') { const k = (now / 1400) % 1; c.globalAlpha = .35; c.fillRect(W / 2 - 10 * u, H / 2 + 6 * u, 20 * u, .15 * u); c.globalAlpha = 1; c.fillRect(W / 2 - 10 * u + 16 * u * k, H / 2 + 5.9 * u, 4 * u, .35 * u); }
    return;
  }
  // objects
  const fading = S.phase === 'done' || S.phase === 'fail';
  tracks.sort((a, b) => a.box.x - b.box.x).forEach((t, i) => {
    const b = t.box;
    for (const k of ['x', 'y', 'w', 'h']) b[k] += (t.tgt[k] - b[k]) * .35;
    const x = b.x * s + ox, y = b.y * s + oy, w = b.w * s, h = b.h * s;
    const alpha = (fading ? .35 : 1) * Math.max(0, 1 - (now - t.seen) / 700);
    brackets(c, x, y, w, h, u, alpha);
    const stack = S.phase === 'task' && tracks.length === 1 && S.progress > 0;
    spaced(c, stack ? 'STACK' : `CUP ${String(i + 1).padStart(2, '0')}`, x, y - 1.7 * u, 1.6 * u, 600, .35 * u, 'left', alpha * .9);
    if (S.phase === 'task' && S.hold > 0 && tracks.length === 1) {       // verifying: a thin ring closes around the stack
      c.lineWidth = .3 * u; c.strokeStyle = '#fff'; c.beginPath();
      c.arc(x + w / 2, y + h / 2, Math.max(w, h) * .72, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * Math.min(1, S.hold / CFG.hold)); c.stroke();
    }
  });
  // reticle
  if (S.phase === 'scan') {
    const r = 2.6 * u, a0 = now / 700;
    c.lineWidth = .25 * u; c.strokeStyle = 'rgba(255,255,255,.75)';
    for (let i = 0; i < 3; i++) { c.beginPath(); c.arc(W / 2, H / 2, r, a0 + i * 2.09, a0 + i * 2.09 + 1.2); c.stroke(); }
  } else if (S.phase === 'task') {
    c.globalAlpha = .55; c.beginPath(); c.arc(W / 2, H / 2, .45 * u, 0, 7); c.fill(); c.globalAlpha = 1;
  }
  // corners of the frame
  spaced(c, 'EARN & SAVE', 4 * u, 5 * u, 1.7 * u, 600, .45 * u, 'left', .9);
  if (S.phase === 'task') {
    const on = Math.floor(now / 600) % 2;
    c.globalAlpha = on ? 1 : .3; c.beginPath(); c.arc(W - 4 * u - .7 * u, 5 * u, .7 * u, 0, 7); c.fill(); c.globalAlpha = 1;
    spaced(c, `REC  ${clock(S.filmed)}`, W - 6.4 * u, 5 * u, 1.7 * u, 600, .3 * u, 'right', .95);
  } else spaced(c, 'STANDBY', W - 4 * u, 5 * u, 1.7 * u, 600, .45 * u, 'right', .6);

  if (S.phase === 'done' || S.phase === 'fail') { card(c, W, H, u, now); return; }
  // bottom: task, guidance, progress
  const by = H - 15 * u;
  spaced(c, 'TASK 01  ·  STACK THE CUPS', W / 2, by - 4 * u, 1.5 * u, 600, .5 * u, 'center', .6);
  spaced(c, S.msg, W / 2, by, 3.4 * u, 500, .04 * u, 'center');
  if (S.phase === 'task') {
    const n = Math.max(1, S.nStart - 1), seg = 6 * u, gap = 1.2 * u, tot = n * seg + (n - 1) * gap;
    for (let i = 0; i < n; i++) { c.globalAlpha = i < S.progress ? 1 : .3; c.fillRect(W / 2 - tot / 2 + i * (seg + gap), by + 4 * u, seg, .3 * u); }
    c.globalAlpha = 1;
    spaced(c, 'PENDING  ·  PAID ONLY WHEN VERIFIED', W / 2, by + 7.2 * u, 1.3 * u, 600, .35 * u, 'center', .55);
  }
  spaced(c, 'FOOTAGE TO ALLOTMENT ROBOTICS PARTNERS', W / 2, H - 3.2 * u, 1.2 * u, 600, .4 * u, 'center', .45);
  if (CFG.debug) {
    const A = S.A;
    spaced(c, `${S.phase}  items ${A ? A.items.length : '-'}  near ${A ? A.near : '-'}  hands ${A ? A.handsOver : '-'}  steady ${steadyCount(now)}  ${S.ms | 0} ms  ${vw}x${vh}`, W / 2, 10 * u, 1.5 * u, 500, 0, 'center', .9);
  }
}
function card(c, W, H, u, now) {
  const k = Math.min(1, (now - S.doneAt) / 500);
  c.shadowBlur = 0; c.fillStyle = `rgba(0,0,0,${.55 * k})`; c.fillRect(0, 0, W, H); c.fillStyle = '#fff'; c.shadowBlur = 8;
  const y = H / 2 - 9 * u;
  if (S.phase === 'fail') {
    spaced(c, 'NOT VERIFIED', W / 2, y + 4 * u, 2 * u, 600, .6 * u, 'center', k);
    spaced(c, 'No credit for this session', W / 2, y + 11 * u, 3.2 * u, 400, 0, 'center', k);
    return;
  }
  const cr = S.credit;
  spaced(c, 'VERIFIED', W / 2, y, 2 * u, 600, .7 * u, 'center', k);
  c.globalAlpha = k; c.fillRect(W / 2 - 6 * u, y + 3 * u, 12 * u, .15 * u); c.globalAlpha = 1;
  spaced(c, `$${cr.dollars.toFixed(2)}`, W / 2, y + 11 * u, 11 * u, 200, 0, 'center', k);
  spaced(c, `${cr.mtok.toFixed(2)} MTOK  ·  ${clock(cr.secs)} FILMED  ·  ${Math.max(1, Math.round(cr.secs / RESET_S * 100))}% OF A RESET`, W / 2, y + 19 * u, 1.6 * u, 600, .35 * u, 'center', .85 * k);
  spaced(c, 'Your footage is teaching a robot to stack cups. Thank you.', W / 2, y + 24.5 * u, 2.2 * u, 400, 0, 'center', .8 * k);
  spaced(c, 'Licensed to Allotment Robotics Partners under Terms, clause 14.3.', W / 2, y + 28.5 * u, 1.4 * u, 400, 0, 'center', .55 * k);
  spaced(c, 'Design fiction by an IDEA9201 student group. Nothing is recorded or uploaded.', W / 2, H - 3.2 * u, 1.1 * u, 400, 0, 'center', .4 * k);
}

// ---- start: camera first, nothing to press -----------------------------------------------
async function start() {
  S.msg = 'Starting your glass';
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } } });
    for (const e of eyes) { e.v.srcObject = stream; e.v.play().catch(() => {}); }
  } catch (e) { S.phase = 'nocam'; S.msg = 'Allow camera access, then reload'; return; }
  try { await navigator.wakeLock?.request('screen'); } catch (e) {}
  try {
    const vision = await FilesetResolver.forVisionTasks('./vendor/wasm');
    const opts = d => ({ baseOptions: { modelAssetPath: './models/efficientdet_lite0.tflite', delegate: d }, runningMode: 'VIDEO', scoreThreshold: CFG.score, maxResults: 12 });
    try { detector = await ObjectDetector.createFromOptions(vision, opts(CFG.delegate)); }
    catch (e) { detector = await ObjectDetector.createFromOptions(vision, opts('CPU')); }
  } catch (e) { S.phase = 'nocam'; S.msg = 'No supply to your glass. Check the connection, then reload'; return; }
  S.phase = 'scan';
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') navigator.wakeLock?.request('screen').catch(() => {}); });

let last = performance.now(), lastDet = 0, lastTs = 0;
function frame(now) {
  const dt = Math.min(.5, (now - last) / 1000); last = now;   // slow phones draw few frames, time must still add up
  if (detector && video.readyState >= 2 && now - lastDet > 66) {
    lastDet = now;
    const t0 = performance.now(), ts = Math.max(lastTs + 1, Math.round(now)); lastTs = ts;
    try {
      const r = detector.detectForVideo(video, ts);
      S.A = analyse(r.detections, video.videoWidth, video.videoHeight, now); S.At = now;
      updateTracks(S.A.items, now);
    } catch (e) {}
    S.ms = performance.now() - t0;
  }
  if (S.phase !== 'boot' && S.phase !== 'nocam') step(now, dt);
  for (const e of eyes) {
    const r = e.c.getBoundingClientRect(), dpr = Math.min(2, devicePixelRatio || 1);
    if (e.c.width !== Math.round(r.width * dpr) || e.c.height !== Math.round(r.height * dpr)) { e.c.width = Math.round(r.width * dpr); e.c.height = Math.round(r.height * dpr); }
    const c = e.c.getContext('2d'); c.setTransform(dpr, 0, 0, dpr, 0, 0);
    draw(c, r.width, r.height, now);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
start();
window.__glass = { S, CFG };
</script>
</body>
</html>
